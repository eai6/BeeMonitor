site_name: BeeMonitor Docs
site_description: Open-source hardware and analysis platform for studying pollinator behaviour from video — nest hotels, flowers, lab assays.
site_url: https://eai6.github.io/BeeMonitor/
repo_url: https://github.com/eai6/BeeMonitor
repo_name: eai6/BeeMonitor
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Edward Idun Amoah &middot; AGPLv3

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}

validation:
  anchors: warn

nav:
  - Home: index.md
  - Get started: get-started.md
  - Build a unit:
      - hardware/index.md
      - Build: hardware/build.md
      - Set up & deploy: hardware/setup.md
      - Troubleshooting: hardware/troubleshooting.md
  - Use the platform:
      - platform/index.md
      - Devices: platform/devices.md
      - Videos: platform/videos.md
      - Pipelines: platform/pipelines.md
      - Results: platform/results.md
      - Annotation & sharing: platform/annotation.md
      - API: platform/api.md
  - About: about.md
