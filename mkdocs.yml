site_name: BeeMonitor Docs
site_description: Build a BeeMonitor camera trap for bee hotels and use the BeeMonitor platform.
site_url: https://eai6.github.io/BeeMonitor/
repo_url: https://github.com/eai6/BeeMonitor
repo_name: eai6/BeeMonitor
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Edward Idun Amoah &middot; AGPLv3

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}

nav:
  - Introduction: index.md
  - Hardware:
      - Overview: hardware/index.md
      - Components: hardware/components.md
      - Enclosure: hardware/enclosure.md
      - Assembly: hardware/assembly.md
      - Field deployment: hardware/deployment.md
  - Device setup:
      - Set up a unit: software/setup.md
      - Troubleshooting: software/troubleshooting.md
  - Using the platform:
      - Devices: platform/devices.md
      - Videos & photos: platform/videos.md
      - Pipelines: platform/pipelines.md
      - Annotation & training: platform/annotation.md
  - About:
      - How it works: about/methods.md
      - License & citation: about/license.md
