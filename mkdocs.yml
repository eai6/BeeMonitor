site_name: BeeMonitor Docs
site_description: Open-source hardware and analysis platform for studying pollinator behaviour from video — nest hotels, flowers, lab assays.
site_url: https://eai6.github.io/BeeMonitor/
repo_url: https://github.com/eai6/BeeMonitor
repo_name: eai6/BeeMonitor
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Edward Idun Amoah &middot; AGPLv3

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: green
      accent: light green
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: green
      accent: light green
      toggle: {icon: material/weather-sunny, name: Light mode}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - navigation.top
    - search.suggest
    - content.tabs.link
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed: {alternate_style: true}

nav:
  - Home: index.md
  - Hardware:
      - Overview: hardware/index.md
      - Components: hardware/components.md
      - Enclosure: hardware/enclosure.md
      - Assembly: hardware/assembly.md
      - Field deployment: hardware/deployment.md
      - Set up a unit: software/setup.md
      - Troubleshooting: software/troubleshooting.md
  - Platform:
      - Devices: platform/devices.md
      - Getting video in: platform/sources.md
      - Videos & photos: platform/videos.md
      - Pipelines: platform/pipelines.md
      - Steps & templates: concepts/pipelines.md
      - Events & interactions: concepts/results.md
      - Annotation & training: platform/annotation.md
      - Sharing & publishing: platform/sharing.md
      - API: platform/api.md
  - Open source:
      - What's in the repo: open-source/index.md
      - Contributing: open-source/contributing.md
      - How it works: about/methods.md
      - Architecture: concepts/index.md
      - Glossary: concepts/glossary.md
      - License & citation: about/license.md
