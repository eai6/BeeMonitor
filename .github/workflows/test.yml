name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  cloud-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install cloud deps
        run: |
          pip install -r cloud/requirements-cloud.txt
          pip install pytest boto3 modal cryptography
      - name: Run cloud tests
        run: python -m pytest cloud/tests/ -v -o "addopts="

  django-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: beemonitor_web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r requirements/development.txt django-filter
      - name: Run checks
        run: python manage.py check
      - name: Run migrations
        run: python manage.py migrate
