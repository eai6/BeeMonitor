name: Build SageMaker GPU image

# Builds the BeeMonitor SageMaker inference image and pushes it to ECR.
# App Runner's auto-deploy doesn't apply here — SageMaker endpoint rollover
# happens via Pulumi (`pulumi up` rebuilds the EndpointConfig pointing at the
# new image tag). This workflow's only job is to keep the :latest tag fresh.

on:
  push:
    branches: [main]
    paths:
      - "sagemaker_backend/**"
      - "src/beemonitor/**"
      - "cloud/**"
      - ".github/workflows/build-sagemaker-image.yml"
  workflow_dispatch:

# Two images, each to its own ECR repo: the GPU video endpoint (which also serves
# SAM 3) and the fine-tuning trainer.

# Read-only by default; jobs that need OIDC ask for id-token: write.
permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::495331821764:role/beemonitor-dev-github-actions
  ECR_REPOSITORY: beemonitor-sm-dev

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Free up disk on the runner — the CUDA layer + torch pull are ~6 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                       /usr/local/share/boost
          df -h

      - name: Build & push GPU image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA_TAG: ${{ github.sha }}
          # Bake the gated facebook/sam3 weights for the optional text-prompt
          # tracking detector (Dockerfile.gpu). Fails the build if unset.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is not set — cannot bake gated facebook/sam3 weights." >&2
            echo "Accept the license at hf.co/facebook/sam3 and set the HF_TOKEN repo secret." >&2
            exit 1
          fi
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          DOCKER_BUILDKIT=1 docker build \
            -f sagemaker_backend/Dockerfile.gpu \
            --secret id=hf_token,env=HF_TOKEN \
            --platform linux/amd64 \
            -t "${IMAGE}:${SHA_TAG}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${SHA_TAG} and :latest"

  # Fine-tuning trainer image (Dockerfile.training) → its own ECR repo.
  build-push-training:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REPOSITORY: beemonitor-sm-dev-training
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                       /usr/local/share/boost
          df -h

      - name: Build & push training image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          DOCKER_BUILDKIT=1 docker build \
            -f sagemaker_backend/Dockerfile.training \
            --platform linux/amd64 \
            -t "${IMAGE}:${SHA_TAG}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${SHA_TAG} and :latest"

  # SAM 3 auto-labeler image (Dockerfile.sam3, GPU) → its own ECR repo. Needs the
  # HF_TOKEN secret to bake the GATED facebook/sam3 weights; the job fails without
  # it (add repo secret HF_TOKEN after accepting the license at hf.co/facebook/sam3).
  build-push-sam3:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      ECR_REPOSITORY: beemonitor-sm-dev-sam3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build & push SAM 3 image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA_TAG: ${{ github.sha }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_TOKEN secret is not set — cannot bake gated facebook/sam3 weights." >&2
            echo "Accept the license at https://huggingface.co/facebook/sam3 and add the" >&2
            echo "HF_TOKEN repo secret, then re-run." >&2
            exit 1
          fi
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          DOCKER_BUILDKIT=1 docker build \
            -f sagemaker_backend/Dockerfile.sam3 \
            --secret id=hf_token,env=HF_TOKEN \
            --platform linux/amd64 \
            -t "${IMAGE}:${SHA_TAG}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${SHA_TAG} and :latest"
