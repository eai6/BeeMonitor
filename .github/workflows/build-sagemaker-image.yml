name: Build SageMaker GPU image

# Builds the BeeMonitor SageMaker inference image and pushes it to ECR.
# App Runner's auto-deploy doesn't apply here — SageMaker endpoint rollover
# happens via Pulumi (`pulumi up` rebuilds the EndpointConfig pointing at the
# new image tag). This workflow's only job is to keep the :latest tag fresh.

on:
  push:
    branches: [main]
    paths:
      - "sagemaker_backend/**"
      - "src/beemonitor/**"
      - "cloud/**"
      - ".github/workflows/build-sagemaker-image.yml"
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::495331821764:role/beemonitor-dev-github-actions
  ECR_REPOSITORY: beemonitor-sm-dev

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # Free up disk on the runner — the CUDA layer + torch pull are ~6 GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                       /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                       /usr/local/share/boost
          df -h

      - name: Build & push GPU image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          SHA_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          DOCKER_BUILDKIT=1 docker build \
            -f sagemaker_backend/Dockerfile.gpu \
            --platform linux/amd64 \
            -t "${IMAGE}:${SHA_TAG}" \
            -t "${IMAGE}:latest" \
            .
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
          echo "Pushed ${IMAGE}:${SHA_TAG} and :latest"
