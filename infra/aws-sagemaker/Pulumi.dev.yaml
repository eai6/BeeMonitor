config:
  aws:region: us-east-1
  beemonitor-sagemaker:environment: dev
  beemonitor-sagemaker:instance-type: ml.g4dn.xlarge
  # Image tag in ECR to deploy. CI bumps this after a successful push;
  # for now :latest tracks the most recent main build.
  beemonitor-sagemaker:image-tag: fb27c941d8264819abb976cbfd5f325867e05d23
  # Two-pass deploy: pass 1 (false) creates ECR + buckets + IAM only,
  # then CI builds the GPU image, then flip to true to create the
  # SageMaker Model / EndpointConfig / Endpoint / autoscaling.
  beemonitor-sagemaker:deploy-endpoint: "true"
  beemonitor-sagemaker:max-capacity: "4"
  beemonitor-sagemaker:deploy-bioclip: "true"
  # SAM 3 auto-labeler (GPU async, scale-to-zero). Image baked with SAM 3 + DINOv2.
  beemonitor-sagemaker:deploy-sam3: "true"
  beemonitor-sagemaker:sam3-image-tag: cf0e0a40ca42f4489cc28bfa61688cc5f28ba5e9
encryptionsalt: v1:KP9os4EO1pI=:v1:Uz8+RClcZwOfibt8:95C+OrayaNewT+KduPYUMyEg3dj+cw==
