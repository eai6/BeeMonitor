{% extends "base.html" %}
{% block title %}{% block page_title %}Platform{% endblock %} - BeeMonitor{% endblock %}

{% block content %}
<div class="flex flex-col md:flex-row gap-6">
  <nav class="md:w-48 shrink-0 flex md:flex-col gap-1 overflow-x-auto text-sm" aria-label="Platform">
    {% with s=section %}
    <a href="{% url 'platform_admin:overview' %}" class="px-3 py-2.5 rounded-md whitespace-nowrap {% if s == 'overview' %}bg-green-100 text-green-900 font-semibold{% else %}text-gray-700 hover:bg-gray-100{% endif %}" {% if s == 'overview' %}aria-current="page"{% endif %}>Overview</a>
    <a href="{% url 'platform_admin:users' %}" class="px-3 py-2.5 rounded-md whitespace-nowrap {% if s == 'users' %}bg-green-100 text-green-900 font-semibold{% else %}text-gray-700 hover:bg-gray-100{% endif %}" {% if s == 'users' %}aria-current="page"{% endif %}>Users</a>
    <a href="{% url 'platform_admin:codes' %}" class="px-3 py-2.5 rounded-md whitespace-nowrap {% if s == 'codes' %}bg-green-100 text-green-900 font-semibold{% else %}text-gray-700 hover:bg-gray-100{% endif %}" {% if s == 'codes' %}aria-current="page"{% endif %}>Promo codes</a>
    <a href="{% url 'platform_admin:activity' %}" class="px-3 py-2.5 rounded-md whitespace-nowrap {% if s == 'activity' %}bg-green-100 text-green-900 font-semibold{% else %}text-gray-700 hover:bg-gray-100{% endif %}" {% if s == 'activity' %}aria-current="page"{% endif %}>Activity &amp; audit log</a>
    <a href="{% url 'accounts:email_status' %}" class="px-3 py-2.5 rounded-md whitespace-nowrap text-gray-700 hover:bg-gray-100">Email</a>
    {% endwith %}
  </nav>
  <div class="flex-1 min-w-0 flex flex-col gap-5">
    {% block platform %}{% endblock %}
  </div>
</div>
{% endblock %}
