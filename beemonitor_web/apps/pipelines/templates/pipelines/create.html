{% extends "base.html" %}
{% block title %}New pipeline — BeeMonitor{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-900 mb-6">New pipeline</h1>
  <form method="post" class="bg-white rounded-lg shadow-sm border border-gray-200 p-6 space-y-4">
    {% csrf_token %}
    <div>
      <label class="block text-sm font-medium text-gray-700">Title</label>
      <input name="title" type="text" placeholder="Foraging trips"
             class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-amber-500 focus:ring-amber-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700">Description</label>
      <textarea name="description" rows="2"
                class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-amber-500 focus:ring-amber-500"></textarea>
    </div>
    {% if templates %}
    <div>
      <label class="block text-sm font-medium text-gray-700">Start from a template (optional)</label>
      <select name="template_id" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm">
        <option value="">— Blank pipeline —</option>
        {% for t in templates %}<option value="{{ t.pk }}">{{ t.title }}</option>{% endfor %}
      </select>
    </div>
    {% endif %}
    <div class="flex justify-end gap-2">
      <a href="{% url 'pipelines:list' %}" class="px-4 py-2 text-sm text-gray-600">Cancel</a>
      <button type="submit" class="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-md text-sm font-medium">Create</button>
    </div>
  </form>
</div>
{% endblock %}
