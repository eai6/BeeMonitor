{% extends "base.html" %}
{% block title %}Password changed - BeeMonitor{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white shadow rounded-lg p-8 text-center">
    <h2 class="text-2xl font-bold text-gray-900 mb-4">Password changed</h2>
    <p class="text-sm text-gray-600 mb-6">
      Your password has been updated. You can now sign in with your new password.
    </p>
    <a href="{% url 'accounts:login' %}"
       class="inline-block bg-amber-600 hover:bg-amber-700 text-white py-2 px-6 rounded font-medium text-sm">Sign in</a>
  </div>
</div>
{% endblock %}
