{% extends "base.html" %}
{% block title %}Login - BeeMonitor{% endblock %}

{% block content %}
<div class="max-w-md mx-auto">
  <div class="bg-white shadow rounded-lg p-8">
    <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Sign In</h2>
    <form method="post">
      {% csrf_token %}
      {% if form.errors %}
      <div class="bg-red-50 text-red-700 rounded p-3 mb-4 text-sm">
        Invalid username or password.
      </div>
      {% endif %}
      <div class="mb-4">
        <label for="id_username" class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" name="username" id="id_username" required
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
      </div>
      <div class="mb-6">
        <label for="id_password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" name="password" id="id_password" required
               class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 focus:border-amber-500">
      </div>
      <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white py-2 px-4 rounded font-medium text-sm">Sign In</button>
    </form>
    <p class="mt-4 text-center text-sm text-gray-500">
      Don't have an account? <a href="{% url 'accounts:register' %}" class="text-amber-600 hover:underline">Register</a>
    </p>
  </div>
</div>
{% endblock %}
