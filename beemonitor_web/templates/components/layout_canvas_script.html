{% comment %} The layout editor's drawing script (unit, site or clip), memory/52. The page
   sets window.LAYOUT_CFG first and provides roi_json / nests_json. {% endcomment %}
<script>
(function () {
  // Set by the page before this script: {saveUrl, extraSave?() -> Promise,
  // extraBody?() -> {}}. roi/nests come from roi_json / nests_json.
  var CFG = window.LAYOUT_CFG || {};
  var CSRF = "{{ csrf_token }}";
  var SAVE_URL = CFG.saveUrl;
  var img = document.getElementById('bgimg'), cv = document.getElementById('cv');
  var ctx = cv.getContext('2d');
  var mode = 'roi', tool = 'rect', selected = null;   // selected: {type:'nest',i} | {type:'roi'}

  // Every shape is {box:[x1,y1,x2,y2], points:[[x,y],...]|null}, normalized 0..1.
  // A rectangle has no points; a polygon carries both, and its box is the
  // bounding box — so anything that only reads boxes still works.
  var roi = {{ roi_json|js }} || null;        // {box, points?} | null
  var nests = {{ nests_json|js }} || [];      // [{id, box, points?, name?}]
  var ROI_COLOR = '#16a34a', NEST_COLOR = '#dc2626';
  var GRAB = 8;                                 // px radius for vertex grabbing

  function size() {
    cv.width = img.clientWidth; cv.height = img.clientHeight;
    cv.style.width = img.clientWidth + 'px'; cv.style.height = img.clientHeight + 'px';
    draw();
  }
  function pos(e) { var r = cv.getBoundingClientRect(); var t = e.touches ? e.touches[0] : e;
                    return [t.clientX - r.left, t.clientY - r.top]; }
  function toN(p) { return [p[0]/cv.width, p[1]/cv.height]; }
  function toP(n) { return [n[0]*cv.width, n[1]*cv.height]; }
  function rectOf(p1, p2) { return [Math.min(p1[0],p2[0])/cv.width, Math.min(p1[1],p2[1])/cv.height,
                                    Math.max(p1[0],p2[0])/cv.width, Math.max(p1[1],p2[1])/cv.height]; }
  function cornersOf(b) { return [[b[0],b[1]], [b[2],b[1]], [b[2],b[3]], [b[0],b[3]]]; }
  function bboxOf(pts) { var xs = pts.map(function(p){return p[0];}), ys = pts.map(function(p){return p[1];});
                         return [Math.min.apply(null,xs), Math.min.apply(null,ys),
                                 Math.max.apply(null,xs), Math.max.apply(null,ys)]; }
  // The outline of a shape, whichever kind it is — draw/hit-test go through this.
  function outline(s) { return s.points || cornersOf(s.box); }
  function shapes() { return (roi ? [roi] : []).concat(nests); }

  function pathOf(pts) {
    ctx.beginPath();
    pts.forEach(function (n, i) { var p = toP(n);
      if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
    ctx.closePath();
  }
  function inShape(px, s) {           // ray casting, in pixel space
    var pts = outline(s).map(toP), inside = false;
    for (var i = 0, j = pts.length - 1; i < pts.length; j = i++) {
      var xi = pts[i][0], yi = pts[i][1], xj = pts[j][0], yj = pts[j][1];
      if ((yi > px[1]) !== (yj > px[1]) &&
          px[0] < (xj - xi) * (px[1] - yi) / (yj - yi) + xi) inside = !inside;
    }
    return inside;
  }
  function vertexAt(px, s) {         // index of the polygon vertex under the cursor
    if (!s.points) return -1;
    for (var i = 0; i < s.points.length; i++) {
      var p = toP(s.points[i]);
      if (Math.abs(p[0]-px[0]) <= GRAB && Math.abs(p[1]-px[1]) <= GRAB) return i;
    }
    return -1;
  }
  function shapeOf(sel) { return !sel ? null : sel.type === 'roi' ? roi : nests[sel.i]; }

  // ── Drawing ────────────────────────────────────────────────────────────────
  var poly = null;   // in-progress polygon: {kind:'roi'|'nest', pts:[[px,py],...], cursor}

  function draw(temp) {
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (roi) drawShape(roi, ROI_COLOR, selected && selected.type === 'roi', '');
    nests.forEach(function (n, i) {
      drawShape(n, NEST_COLOR, selected && selected.type === 'nest' && selected.i === i, n.name || String(n.id));
    });
    if (temp) {                                   // rubber-band rectangle
      ctx.lineWidth = 2; ctx.setLineDash([5,4]);
      ctx.strokeStyle = mode === 'nest' ? NEST_COLOR : ROI_COLOR;
      pathOf(cornersOf(temp)); ctx.stroke(); ctx.setLineDash([]);
    }
    if (poly) drawPending();
  }

  function drawShape(s, color, isSelected, label) {
    var pts = outline(s);
    ctx.lineWidth = isSelected ? 4 : 2;
    ctx.strokeStyle = color;
    pathOf(pts); ctx.stroke();
    ctx.fillStyle = color === ROI_COLOR ? 'rgba(22,163,74,0.08)' : 'rgba(220,38,38,0.06)';
    ctx.fill();
    if (label) { var b = toP([s.box[0], s.box[1]]);
      ctx.fillStyle = color; ctx.font = 'bold 14px sans-serif';
      ctx.fillText(label, b[0]+3, Math.max(b[1]-3, 12)); }
    if (isSelected && s.points) {                 // vertex handles, for dragging
      ctx.fillStyle = '#ffffff'; ctx.strokeStyle = color; ctx.lineWidth = 2;
      s.points.forEach(function (n) { var p = toP(n);
        ctx.beginPath(); ctx.rect(p[0]-4, p[1]-4, 8, 8); ctx.fill(); ctx.stroke(); });
    }
  }

  function drawPending() {
    var color = poly.kind === 'nest' ? NEST_COLOR : ROI_COLOR;
    var pts = poly.pts.concat(poly.cursor ? [poly.cursor] : []);
    ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.setLineDash([5,4]);
    ctx.beginPath();
    pts.forEach(function (p, i) { if (i === 0) ctx.moveTo(p[0], p[1]); else ctx.lineTo(p[0], p[1]); });
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = color;
    poly.pts.forEach(function (p, i) {
      ctx.beginPath(); ctx.arc(p[0], p[1], i === 0 ? 5 : 3, 0, Math.PI*2); ctx.fill(); });
  }

  // ── Polygon input ──────────────────────────────────────────────────────────
  function polyClick(p) {
    if (!poly) { poly = {kind: mode, pts: [p], cursor: p}; setHint(); return; }
    var first = poly.pts[0];
    if (poly.pts.length >= 3 &&
        Math.abs(p[0]-first[0]) <= GRAB && Math.abs(p[1]-first[1]) <= GRAB) { closePoly(); return; }
    poly.pts.push(p); draw();
  }
  function closePoly() {
    if (!poly || poly.pts.length < 3) { poly = null; setHint(); draw(); return; }
    var pts = poly.pts.map(toN), shape = {box: bboxOf(pts), points: pts};
    if (poly.kind === 'nest') { shape.id = nextId(); nests.push(shape); selected = {type:'nest', i: nests.length-1}; }
    else { roi = shape; selected = {type:'roi'}; }
    poly = null; setHint(); draw();
  }
  function cancelPoly() { poly = null; setHint(); draw(); }

  // ── Pointer handling ───────────────────────────────────────────────────────
  var drag = null;  // {start,last} while rubber-banding | {moving|vertex, last}

  // Read-only preview of a past layout version; the edited layout is parked
  // in `parked` and restored by "Back to current".
  var viewing = null, parked = null;
  function copy(x) { return JSON.parse(JSON.stringify(x)); }
  window.viewLayout = function (v) {
    if (!v) return;
    cancelPoly();
    if (!viewing) parked = {roi: roi, nests: nests};
    viewing = v; selected = null; drag = null;
    roi = v.roi ? copy(v.roi) : null; nests = copy(v.nests || []);
    document.getElementById('viewing-text').innerHTML =
      '<b>Viewing layout v' + v.number + '</b> · ' + v.span.replace(/[<>&]/g, '') + ' · read-only';
    document.getElementById('viewing-banner').classList.remove('hidden');
    var tb = document.getElementById('toolbar');
    tb.style.opacity = '0.4'; tb.style.pointerEvents = 'none';
    renderLayoutHistory(window._layoutVersions, v.number);
    draw();
  };
  function backToCurrent() {
    if (!viewing) return;
    roi = parked.roi; nests = parked.nests; viewing = null; parked = null; selected = null;
    document.getElementById('viewing-banner').classList.add('hidden');
    var tb = document.getElementById('toolbar');
    tb.style.opacity = ''; tb.style.pointerEvents = '';
    renderLayoutHistory(window._layoutVersions, null);
    draw();
  }
  document.getElementById('viewing-back').addEventListener('click', backToCurrent);

  function down(e) {
    if (viewing) return;
    e.preventDefault(); var p = pos(e);
    if (mode !== 'move' && tool === 'poly') { polyClick(p); return; }
    if (mode === 'move') {
      var s = shapeOf(selected);
      var vi = s ? vertexAt(p, s) : -1;          // grab a vertex of the selection first
      if (vi >= 0) { drag = {vertex: vi, last: p}; return; }
      selected = hit(p);
      drag = selected ? {moving: true, last: p} : null;
    } else { drag = {start: p, last: p}; }
    draw();
  }
  function move(e) {
    if (poly) { poly.cursor = pos(e); draw(); return; }
    if (!drag) return;
    e.preventDefault(); var p = pos(e);
    if (mode === 'move' && selected) {
      var s = shapeOf(selected);
      if (!s) { drag = null; return; }
      if (drag.vertex !== undefined) {
        s.points[drag.vertex] = [Math.max(0, Math.min(1, p[0]/cv.width)),
                                 Math.max(0, Math.min(1, p[1]/cv.height))];
        s.box = bboxOf(s.points);
      } else if (drag.moving) {
        var dx = (p[0]-drag.last[0])/cv.width, dy = (p[1]-drag.last[1])/cv.height;
        translate(s, dx, dy);
      }
      drag.last = p; draw();
    } else if (mode !== 'move') { draw(rectOf(drag.start, p)); }
  }
  function up(e) {
    if (!drag || poly) return;
    var p = pos(e);
    if (mode === 'roi') { roi = {box: rectOf(drag.start, p), points: null}; selected = {type:'roi'}; }
    else if (mode === 'nest') {
      var box;
      if (Math.abs(p[0]-drag.start[0]) < 5 && Math.abs(p[1]-drag.start[1]) < 5) {
        var s = 0.03, cx = p[0]/cv.width, cy = p[1]/cv.height;   // click -> default box
        box = [cx-s, cy-s, cx+s, cy+s];
      } else { box = rectOf(drag.start, p); }
      nests.push({id: nextId(), box: box, points: null}); selected = {type:'nest', i: nests.length-1};
    }
    drag = null; draw();
  }
  function translate(s, dx, dy) {
    s.box = [s.box[0]+dx, s.box[1]+dy, s.box[2]+dx, s.box[3]+dy];
    if (s.points) s.points = s.points.map(function (n) { return [n[0]+dx, n[1]+dy]; });
  }
  function hit(p) {  // topmost nest, then the ROI
    for (var i = nests.length-1; i >= 0; i--) if (inShape(p, nests[i])) return {type:'nest', i:i};
    if (roi && inShape(p, roi)) return {type:'roi'};
    return null;
  }
  function nextId() { var m = 0; nests.forEach(function (n){ if (n.id>m) m=n.id; }); return m+1; }

  function autonumber() {
    var items = nests.map(function (n){ var b=n.box; return {n:n, cy:(b[1]+b[3])/2, cx:(b[0]+b[2])/2, h:b[3]-b[1]}; });
    if (!items.length) return;
    var hs = items.map(function(t){return t.h;}).sort(function(a,b){return a-b;});
    var gap = Math.max(0.02, hs[hs.length>>1]*0.6);
    items.sort(function(a,b){return a.cy-b.cy;});
    var rows=[], cur=[items[0]], sum=items[0].cy;
    for (var k=1;k<items.length;k++){ if (items[k].cy - sum/cur.length > gap){ rows.push(cur); cur=[items[k]]; sum=items[k].cy; } else { cur.push(items[k]); sum+=items[k].cy; } }
    rows.push(cur);
    rows.forEach(function (row, ri){ row.sort(function(a,b){return a.cx-b.cx;});
      row.forEach(function (t, ci){ t.n.id = (ci+1) + ri*10; }); });
    draw();
  }

  // ── Controls ───────────────────────────────────────────────────────────────
  function setHint() {
    var el = document.getElementById('hint'), txt;
    if (poly) txt = 'Click to add corners; click the first corner (or press Enter / double-click) to close. ' +
                    'Backspace undoes a corner, Esc cancels.';
    else if (mode === 'move') txt = 'Click a shape to select; drag to move. Drag a white handle to move a polygon corner. ' +
                                    'Delete selected removes it.';
    else if (tool === 'poly') txt = mode === 'roi'
      ? 'Click around the area to trace the ROI — corners can follow its real outline (replaces the current ROI).'
      : 'Click around a reference object to trace it. Then Auto-number.';
    else txt = mode === 'roi' ? 'Drag to draw the ROI (replaces the current one).'
                              : 'Drag (or click) to add a reference object. Then Auto-number.';
    el.textContent = txt;
  }
  document.querySelectorAll('.mode-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      cancelPoly();
      mode = btn.dataset.mode; selected = null;
      document.querySelectorAll('.mode-btn').forEach(function (b){ b.className = 'mode-btn px-3 py-1.5 bg-white text-gray-700'; });
      btn.className = 'mode-btn px-3 py-1.5 bg-amber-600 text-white';
      document.getElementById('tools').style.opacity = mode === 'move' ? '0.4' : '1';
      setHint(); draw();
    });
  });
  document.querySelectorAll('.tool-btn').forEach(function (btn) {
    btn.addEventListener('click', function () {
      cancelPoly();
      tool = btn.dataset.tool;
      document.querySelectorAll('.tool-btn').forEach(function (b){ b.className = 'tool-btn px-3 py-1.5 bg-white text-gray-700'; });
      btn.className = 'tool-btn px-3 py-1.5 bg-gray-800 text-white';
      setHint(); draw();
    });
  });
  document.getElementById('autonum').addEventListener('click', autonumber);
  document.getElementById('rename').addEventListener('click', function () {
    if (!selected || selected.type !== 'nest') { alert('Select a reference object first (Move / edit, then click it).'); return; }
    var n = nests[selected.i];
    var name = prompt('Name for this reference object (e.g. Flag C, Hole 3). Empty = its number.', n.name || '');
    if (name === null) return;
    name = name.trim().slice(0, 60);
    if (name) n.name = name; else delete n.name;
    draw();
  });
  // A new background frame (the clip editor's frame picker): same shapes,
  // re-fitted to the new picture.
  window.layoutSetImage = function (url) { img.src = url; };
  document.getElementById('del').addEventListener('click', function () {
    if (!selected) return;
    if (selected.type==='roi') roi = null; else nests.splice(selected.i, 1);
    selected = null; draw();
  });
  document.getElementById('clear-roi').addEventListener('click', function(){ roi=null; selected=null; draw(); });
  document.getElementById('clear-nests').addEventListener('click', function(){ nests=[]; selected=null; draw(); });
  document.getElementById('save').addEventListener('click', function () {
    closePoly();   // don't silently drop a polygon the user was mid-way through
    var body = Object.assign({roi: roi, nests: nests}, CFG.extraBody ? CFG.extraBody() : {});
    var roiSave = fetch(SAVE_URL, { method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':CSRF},
      body: JSON.stringify(body) })
      .then(function(r){ return r.json(); });
    Promise.all([roiSave, CFG.extraSave ? CFG.extraSave() : null]).then(function (res) {
        var d = res[0];
        if (d && d.ok) {
          // Adopt what the server stored (clamped + rounded) so the canvas shows
          // exactly what the device will get.
          roi = d.roi ? {box: d.roi, points: d.roi_polygon || null} : null;
          nests = d.nests || []; selected = null; draw();
          if (d.versions) renderLayoutHistory(d.versions, null);
          var s=document.getElementById('saved');
          if (d.message) s.textContent = d.message;
          s.classList.remove('hidden');
          setTimeout(function(){ s.classList.add('hidden'); }, 2500);
        } else { alert((d && d.error) || 'Could not save.'); }
      }).catch(function(err){ alert((err && err.message) || 'Could not save.'); });
  });
  document.addEventListener('keydown', function (e) {
    if (!poly) return;
    if (e.key === 'Enter') { e.preventDefault(); closePoly(); }
    else if (e.key === 'Escape') { e.preventDefault(); cancelPoly(); }
    else if (e.key === 'Backspace') { e.preventDefault();
      poly.pts.pop(); if (!poly.pts.length) cancelPoly(); else draw(); }
  });

  cv.addEventListener('mousedown', down); cv.addEventListener('mousemove', move);
  cv.addEventListener('dblclick', function (e) { e.preventDefault(); closePoly(); });
  window.addEventListener('mouseup', up);
  cv.addEventListener('touchstart', down); cv.addEventListener('touchmove', move);
  window.addEventListener('touchend', up);
  window.addEventListener('resize', size);
  img.addEventListener('load', size);
  if (img.complete) size();
})();
</script>
