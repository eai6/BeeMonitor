<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeeMonitor — Offline</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="text-center p-8">
    <div class="text-6xl mb-4">&#x1F41D;</div>
    <h1 class="text-2xl font-bold text-gray-800 mb-2">You're Offline</h1>
    <p class="text-gray-600 mb-6">BeeMonitor needs an internet connection for this page.</p>
    <p class="text-gray-500 text-sm">Previously loaded pages and cached results are still available.</p>
    <button onclick="location.reload()" class="mt-6 px-4 py-2 bg-amber-500 text-white rounded hover:bg-amber-600">
      Try Again
    </button>
  </div>
</body>
</html>
